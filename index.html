<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TENGEN TOPPA GURREN LAGANN</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url('https://i.pinimg.com/1200x/45/38/bb/4538bb645996c3522051af86cb9d9886.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Roboto', sans-serif;
      color: #ffffff;
      
      display: flex;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding: 40px 5%;
    }

    /* Substitui a div principal por <main> */
    main {
      width: 100%;
      max-width: 580px;
      background: rgba(10, 10, 15, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 42, 42, 0.7);
      border-radius: 16px;
      padding: 30px 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Substitui a div do cabeçalho por <header> */
    header {
      text-align: center;
      border-bottom: 1px solid rgba(255, 42, 42, 0.6);
      padding-bottom: 15px;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 2px 2px 4px #000000, 0 0 12px #ff2a2a, 0 0 25px #ff6a00;
      margin-bottom: 6px;
    }

    header p {
      color: #39ff14;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-shadow: 1px 1px 3px #000000, 0 0 8px rgba(57, 255, 20, 0.8);
    }

    /* Substitui as divs de cards por <section> */
    section {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 106, 0, 0.45);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s ease, transform 0.3s ease, border-color 0.3s ease;
    }

    section:hover {
      background: rgba(0, 0, 0, 0.55);
      transform: translateX(6px);
      border-color: #39ff14;
    }

    section h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      color: #ffaa00;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 1px 1px 4px #000000;
    }

    iframe, video {
      width: 100%;
      height: 260px;
      border-radius: 8px;
      border: 1px solid rgba(255, 42, 42, 0.8);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 30px;
      opacity: 0.9;
    }

    /* Substitui a div de rodapé por <footer> */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #ffffff;
      text-shadow: 1px 1px 3px #000000;
    }

    @media (max-width: 768px) {
      body {
        justify-content: center;
        padding: 20px 15px;
      }
      header h1 {
        font-size: 1.4rem;
      }
      iframe, video {
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <main>
    
    <header>
      <h1>Super Tengen Toppa Gurren Lagann</h1>
      <p>"A minha broca é a broca que vai perfurar os céus!"</p>
    </header>

    <section>
      <h2>🔥 Cena Épica (YouTube)</h2>
      <iframe src="https://www.youtube.com/embed/ZxNss-vrB2g" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>

    <section>
      <h2>🎵 "Libera Me" From Hell</h2>
      <audio controls>
        <source src="2-22. 'Libera me' from hell.mp3" type="audio/mpeg">
        Seu navegador não suporta o elemento de áudio.
      </audio>
    </section>

    <section>
      <h2>🎬 Vídeo Local</h2>
      <video controls poster="capa-do-video.jpg">
        <source src="-paJdc.mp4" type="video/mp4">
        Seu navegador não suporta a tag de vídeo.
      </video>
    </section>

    <footer>
      <p>Dai-Gurren Brigade &copy; 2026</p>
    </footer>

  </main>

</body>
</html>
